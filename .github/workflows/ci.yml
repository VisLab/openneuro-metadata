name: CI

# Runs the citation-pipeline test suite on every push and on PRs to main.
# All tests are offline (no network calls in test code); cached fixture
# JSON files stand in for live Crossref / OpenAlex / Europe PMC / OSF
# responses.  See tests/fixtures/ for the cached payloads.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test dependencies
        # Install only what the test suite actually imports.  The full
        # project depends on marker-pdf (heavy ML library used by
        # src/convert_pdfs.py) which is NOT exercised by any test, so we
        # skip it in CI to keep runs fast.  If a test ever needs the
        # full dependency set, switch to `pip install -e ".[dev]"` after
        # adding a [project.optional-dependencies] section to pyproject.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas requests python-dotenv

      - name: Show test inventory
        run: |
          echo "Test files:"
          ls tests/ | grep '^test_' | sort
          echo
          echo "Total test count:"
          pytest tests/ --collect-only -q 2>&1 | tail -3 || true

      - name: Run test suite
        run: pytest tests/ -v --tb=short --color=yes

      - name: Test-suite summary
        if: always()
        run: |
          echo "::group::Run report"
          pytest tests/ --tb=no -q 2>&1 | tail -10 || true
          echo "::endgroup::"
